name: Temporary prepare v0.43.1 reader-provider closeout
on:
  push:
    branches:
      - release/v0431-reader-provider-closeout-20261031
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0431-reader-provider-closeout-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify real production ESV NASB20 NIV and NKJV responses
        run: npm run check:live-reader
      - name: Generate mandatory patch release and validate complete build
        run: |
          test "$(node -p "require('./package.json').version")" = "0.43.0"
          npm run release -- patch "Bible reader: verified four editions and safer provider failures" "Verify live ESV, NASB20, NIV and NKJV passage delivery, visible publisher notices and safe failure-and-recovery paths with reproducible no-text logging checks." "Harden the Crossway integration against redirects, excessive responses, malformed payloads and network timeouts, matching existing API.Bible protections." "Close two evidence-backed v1 reader provider criteria while preserving separate open publisher permissions, wider security, accessibility and launch verification requirements."
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare v0.43.1 with npm run release"
          git push origin HEAD:release/v0431-reader-provider-closeout-20261031
