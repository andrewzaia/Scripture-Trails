name: Temporary prepare v0.39.0 Paul Scripture study
on:
  push:
    branches:
      - release/v0.39-paul-study-20261031
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.39-paul-study-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate and validate v0.39.0 through mandatory release script
        run: |
          test "$(node -p "require('./package.json').version")" = "0.38.0"
          npm run release -- minor "Paul's first and second journeys: deeper Scripture study" "Add original biblical reading context and relevant Scripture links to all 39 stages of Paul's first two missionary journeys." "Clarify the uncertain Berea-to-Athens route with a source-linked academic geographic assessment and preserve location cautions." "Keep the 44 later Pauline stages and remaining v1.0 editorial acceptance checks explicitly open."
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare v0.39.0 with npm run release"
          git push origin HEAD:release/v0.39-paul-study-20261031
