name: Prepare v0.44.9 Bethsaida evidence patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v0449-bethsaida-balanced-sources' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare verified SemVer PATCH
        run: |
          set -eu
          CURRENT_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$CURRENT_VERSION" != "0.44.8" ]; then
            echo "Expected v0.44.8 release baseline, found $CURRENT_VERSION"
            exit 1
          fi
          npm run release -- patch "Balanced archaeological evidence for Bethsaida" "Provide candidate-specific excavation citations for et-Tell and el-Araj, including 2025 Roman-period field reports, while explicitly retaining the disputed Gospel identification." "Protect source integrity and interactive selection with unit and browser tests, distinguishing excavated material from excavation-team interpretations." "Run the full browser matrix only after successful source and build checks, retaining complete coverage and the required release gate."
          npm run build
      - name: Remove one-time workflow and commit release
        run: |
          set -eu
          git rm .github/workflows/prepare-v0449.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare v0.44.9 Bethsaida evidence patch"
          git push origin HEAD:work/v0449-bethsaida-balanced-sources
