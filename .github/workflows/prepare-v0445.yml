name: Prepare v0.44.5 source-precision patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v1-people-trail-citations-0445' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare patch using existing release script
        run: |
          set -eu
          CURRENT_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$CURRENT_VERSION" != "0.44.4" ]; then
            echo "Expected release baseline 0.44.4; found $CURRENT_VERSION"
            exit 1
          fi
          npm run release -- patch "Clearer source passages for biblical people" "Widen Abraham's call to include the promise in Genesis 12, Hezekiah's letter to include his prayer in 2 Kings 19, and Paul's Rome account to include Acts 28:31." "Protect the nine corrected passage ranges with regression tests while retaining existing study text and source qualifications."
          npm run build
      - name: Remove one-time release workflow and commit
        run: |
          set -eu
          git rm .github/workflows/prepare-v0445.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare v0.44.5 source-precision patch"
          git push origin HEAD:work/v1-people-trail-citations-0445
