name: Temporary prepare v0.42.0 Gospel geography evidence
on:
  push:
    branches:
      - release/v0.42-gospel-site-evidence-20261031
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.42-gospel-site-evidence-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate and validate v0.42.0 with mandatory release script
        run: |
          test "$(node -p "require('./package.json').version")" = "0.41.0"
          npm run release -- minor "Gospel geography: candidate sites and evidence clarity" "Compare competing archaeological identifications for Bethsaida, Emmaus, Magadan and Sychar, with a separate evidence-limits assessment of Gethsemane tradition." "Add five named academic references and source-specific claim, evidence and uncertainty notes visible in historical place dossiers." "Preserve twelve regional placeholders without invented site citations and leave independent specialist verification and v1.0 launch checks open."
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare v0.42.0 with npm run release"
          git push origin HEAD:release/v0.42-gospel-site-evidence-20261031
