name: Prepare v0.44.22 focus accessibility release (one-time)

on:
  push:
    branches: [release/v0.44.22-route-heading-focus]
    paths: ['.github/workflows/prepare-v04422.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate mandatory semantic patch release and both changelogs
        run: |
          npm run release -- patch \
            "Accessible navigation between study sections" \
            "Move keyboard and screen-reader focus to the active section heading when navigating across study pages." \
            "Preserve initial page focus, Skip to content, passage navigation and mobile navigation behaviour."
      - name: Validate release source, all unit checks and browser test discovery
        run: |
          npm run build
          npx playwright test --list
      - name: Commit release metadata on the isolated working branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/data/releases.json CHANGELOG.md public/index.html public/assets
          test "$(node -p "require('./package.json').version")" = "0.44.22"
          git diff --cached --stat
          git commit -m "Release v0.44.22: accessible heading focus across sections"
          git push origin HEAD:release/v0.44.22-route-heading-focus
