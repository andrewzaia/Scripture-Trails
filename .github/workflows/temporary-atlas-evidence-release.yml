name: One-time Atlas evidence release preparation
on:
  push:
    branches: [milestone/atlas-evidence-20261027]
permissions:
  contents: write
jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: prepare evidence Atlas minor release'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Invoke the standard minor release
        run: npm run release -- minor "Explain Scripture connections in the Atlas" "Added passage explanations and context for selected quotations, parallels, echoes, typology and themes." "Made it easy to separate explained links from the wider community-ranked, unclassified reference archive." "Connected biblical people profiles to relevant Atlas explanations and original passage reading."
      - name: Commit release metadata and versioned assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json public/assets/app.js public/assets/entity-index.js
          git commit -m "Release v0.8.0: passage-explained Atlas"
          git push origin HEAD:milestone/atlas-evidence-20261027
