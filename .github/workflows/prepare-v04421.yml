name: Prepare v0.44.21 release metadata (one-time)

on:
  push:
    branches: [release/v0.44.21-fums-redisplay-rollback]
    paths: ['.github/workflows/prepare-v04421.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Use the mandatory versioned release script
        run: |
          npm run release -- patch \
            "Publisher view reporting and recovery readiness" \
            "Report API.Bible Scripture views when returning to a cached passage." \
            "Document successful live production rollback and restoration in the v1.0 readiness roadmap."
      - name: Run full source validation and tests before committing
        run: |
          npm run build
          npx playwright test --list
      - name: Commit generated release files on the working branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/data/releases.json CHANGELOG.md public/index.html public/assets
          git diff --cached --stat
          test "$(node -p "require('./package.json').version")" = "0.44.21"
          git commit -m "Release v0.44.21: FUMS cached views and recovered production evidence"
          git push origin HEAD:release/v0.44.21-fums-redisplay-rollback
