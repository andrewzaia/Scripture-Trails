name: Prepare v0.44.23 owner publisher acceptance release (one-time)

on:
  push:
    branches: [release/v0.44.23-owner-publisher-acceptance]
    paths: [.github/workflows/prepare-v04423.yml]

permissions:
  contents: write

jobs:
  release-prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate mandatory patch release and both changelogs
        run: |
          npm run release -- patch \
            "Publisher rights acceptance and Safari verification" \
            "Record the project owner's qualified non-commercial publisher-rights acceptance and ongoing licence obligations." \
            "Document native Safari desktop reflow checks while retaining physical-device and native Safari zoom acceptance as open."
      - name: Validate release metadata, source tests and browser test discovery
        run: |
          npm run build
          npx playwright test --list
      - name: Commit release metadata to isolated branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/data/releases.json CHANGELOG.md public/index.html public/assets
          test "$(node -p "require('./package.json').version")" = "0.44.23"
          git diff --cached --stat
          git commit -m "Release v0.44.23: qualified publisher rights and Safari verification"
          git push origin HEAD:release/v0.44.23-owner-publisher-acceptance
