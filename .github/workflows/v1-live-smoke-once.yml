name: One-time v1.0.0 production smoke

on:
  push:
    branches: [audit/v1-0-0-live-smoke-20261102]
    paths: [.github/workflows/v1-live-smoke-once.yml]

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check live v1.0.0 footer, history, roadmap and assets
        env:
          SCRIPTURE_TRAILS_EXPECTED_VERSION: 1.0.0
        run: npm run check:live-v1
      - name: Verify all four real licensed editions without logging passage contents
        run: npm run check:live-reader
