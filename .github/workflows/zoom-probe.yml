name: Audit - real Firefox 200 and 400 percent zoom across 12 views

on:
  push:
    branches: [audit/true-browser-zoom-v1-20261101]
    paths: [.github/workflows/zoom-probe.yml]

permissions:
  contents: read

jobs:
  native-browser-zoom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install real headed Firefox runtime and X11 key injector
        run: |
          npx playwright install --with-deps firefox
          sudo apt-get update -qq
          sudo apt-get install -y xdotool openbox
      - name: Test authentic browser zoom through keyboard shortcuts
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1100x24" bash -c '
            openbox >/tmp/scripture-trails-openbox.log 2>&1 &
            sleep 2
            ZOOM_ENGINE=firefox node tests/zoom/actual-browser-zoom-probe.mjs
          '
