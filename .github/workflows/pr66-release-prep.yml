name: Prepare PR 66 patch release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v1-cross-browser-coverage' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate required patch release and verify source
        run: |
          set -eu
          CURRENT_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$CURRENT_VERSION" != "0.44.2" ]; then
            echo "Unexpected release baseline: $CURRENT_VERSION. Stop rather than bump twice."
            exit 1
          fi
          npm run release -- patch "Cross-browser accessibility verification" "Expand automated regression testing to Chromium, Firefox and WebKit across desktop and mobile device profiles." "Improve light-theme contrast of Historical Cities controls and wait for stable theme transitions during accessibility audits." "Allow Firefox accessibility scans to complete without suppressing any WCAG checks."
          npm run build
      - name: Remove temporary preparation workflow and commit release
        run: |
          set -eu
          git rm .github/workflows/pr66-release-prep.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare v0.44.3 accessibility patch"
          git push origin HEAD:work/v1-cross-browser-coverage
