name: Prepare v0.44.14 Nazareth citation release
on:
  push:
    branches:
      - release/v0.44.14-nazareth-evidence
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare patch through the approved semantic release command
        run: |
          npm run release -- patch "More precise Nazareth Annunciation evidence" \
            "Link the specific archaeological chapter and sacred-site history behind Nazareth's Annunciation study, with transparent source attribution." \
            "Clarify the difference between commemorative tradition, excavation records and an independently confirmed biblical event location." \
            "Add regression tests that validate study citations across the city findings, chronology and detailed interpretation."
      - name: Validate release metadata, data and source tests
        run: |
          npm run build
          npx playwright test --list
      - name: Remove one-time workflow and push verified release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.44.14.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): prepare v0.44.14 Nazareth evidence correction"
          git push origin HEAD:release/v0.44.14-nazareth-evidence
