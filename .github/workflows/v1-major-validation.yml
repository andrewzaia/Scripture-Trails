name: Validate stable v1 release candidate (one time)
on:
  push:
    branches: [release/v1-0-0-owner-approved-20261102]
    paths: [.github/workflows/v1-major-validation.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release -- major "Scripture Trails 1.0 - stable launch" "Introduce the first stable Scripture Trails release with its Bible reader and Scripture studies." "Record owner approval with the retained real-device and Safari zoom limitations."
      - run: npm run build
      - run: git diff --stat
