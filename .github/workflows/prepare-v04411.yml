name: Prepare v0.44.11 Gospel chronology evidence patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v04411-passover-source-precision' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate mandatory SemVer release and run fast verification
        run: |
          set -eu
          BASE="$(node -p 'require("./package.json").version')"
          if [ "$BASE" != "0.44.10" ]; then
            echo "Unexpected v0.44.11 baseline: $BASE"; exit 1
          fi
          npm run release -- patch "Better evidenced Last Supper chronology" "Correct an indirect Gospel audit citation to cite primary Gospel Passover distinctions and three directly relevant peer-reviewed historical chronology analyses." "Display descriptive named links for academic audit sources, retaining the open historical interpretation and independent-specialist review requirement." "Reconcile four older people-trail reference findings confirmed resolved in v0.44.4, with browser and data regression coverage."
          npm run build
          npx playwright test --list
      - name: Remove preparation workflow and commit release
        run: |
          set -eu
          git rm .github/workflows/prepare-v04411.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare v0.44.11 Gospel chronology evidence patch"
          git push origin HEAD:work/v04411-passover-source-precision
