name: Prepare v0.44.8 Cana evidence patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v0448-cana-archaeology-evidence' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate mandatory SemVer patch and validate
        run: |
          set -eu
          CURRENT_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$CURRENT_VERSION" != "0.44.7" ]; then
            echo "Unexpected release baseline: $CURRENT_VERSION"
            exit 1
          fi
          npm run release -- patch "Site-specific archaeology for Cana candidates" "Add separately attributed archaeological sources for Kafr Kanna and Khirbet Qana, keeping the uncertain identification of Cana and the limits of archaeology explicit." "Update the historical-city comparison to display sources for the highlighted proposal, while retaining the general geographical index and validating candidate citations." "Add source-integrity and browser navigation regression tests for the proposed locations."
          npm run build
      - name: Remove one-time preparation and commit release
        run: |
          set -eu
          git rm .github/workflows/prepare-v0448.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare v0.44.8 Cana citation patch"
          git push origin HEAD:work/v0448-cana-archaeology-evidence
