name: Validate website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Pin the tested image while ubuntu-latest transitions to Ubuntu 26.04.
  # Upgrade the runner explicitly after a full cross-browser compatibility run.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Compare the complete PR with its merge base
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check source and tests
        run: npm run build
  # Each engine gets an isolated runner. Firefox's full-page axe scans are
  # resource-heavy; sharing a VM with other browser engines caused intermittent
  # timeouts, hiding real regressions behind runner contention.
  browser:
    name: Browser - ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: '--project=desktop-chromium --project=mobile-chromium'
          - engine: firefox
            projects: '--project=desktop-firefox'
          - engine: webkit
            projects: '--project=desktop-webkit --project=mobile-webkit'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.engine }} and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Cross-browser desktop/mobile journeys, accessibility and layout
        run: npm run test:browser -- ${{ matrix.projects }} --workers=1
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  release-gate:
    if: ${{ always() }}
    needs: [test, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and browser checks
        env:
          SOURCE_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$SOURCE_RESULT" = success && test "$BROWSER_RESULT" = success
