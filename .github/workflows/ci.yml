name: Validate website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR runs are disposable until the latest head is validated. Pushes to main
# never cancel one another; the final PR head still needs every required gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pin the tested image while ubuntu-latest transitions to Ubuntu 26.04.
  # Upgrade the runner explicitly after a full cross-browser compatibility run.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Compare the complete PR with its merge base
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check source and tests
        run: npm run build
      - name: Parse all Playwright browser tests before allocating browser runners
        run: npx playwright test --list
  # Each engine gets an isolated runner. Firefox's full-page axe scans are
  # resource-heavy; sharing a VM with other browser engines caused intermittent
  # timeouts, hiding real regressions behind runner contention.
  # Skip browser setup when the inexpensive source/build job already fails.
  # Every browser engine remains mandatory on PRs after source validation.
  # Protected main merges repeat full source checks but skip a duplicate browser matrix.
  browser:
    if: ${{ github.event_name == 'pull_request' }}
    name: Browser - ${{ matrix.engine }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: '--project=desktop-chromium --project=mobile-chromium'
          - engine: firefox
            projects: '--project=desktop-firefox'
          - engine: webkit
            projects: '--project=desktop-webkit --project=mobile-webkit'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.engine }} and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Cross-browser desktop/mobile journeys, accessibility and layout
        run: npm run test:browser -- ${{ matrix.projects }} --workers=1
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  release-gate:
    if: ${{ always() }}
    needs: [test, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce PR browsers and source-verified main releases
        env:
          SOURCE_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -eu
          echo "Validation event: $EVENT_NAME; ref: $REF_NAME"
          echo "Source: $SOURCE_RESULT; browser matrix: $BROWSER_RESULT"
          if [ "$SOURCE_RESULT" != "success" ]; then
            echo "::error::Source/build validation failed."
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request)
              if [ "$BROWSER_RESULT" != "success" ]; then
                echo "::error::Every PR browser must pass; skipped/cancelled browsers block merge."
                exit 1
              fi
              ;;
            push)
              if [ "$BROWSER_RESULT" != "skipped" ] || [ "$REF_NAME" != "refs/heads/main" ]; then
                echo "::error::Main push must pass source validation and skip duplicate browsers."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected validation event."
              exit 1
              ;;
          esac
          echo "Required release checks passed."
