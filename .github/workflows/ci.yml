name: Validate website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR runs are disposable until the latest head is validated. Pushes to main
# never cancel one another; the final PR head still needs every required gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pin the tested image while ubuntu-latest transitions to Ubuntu 26.04.
  # Upgrade the runner explicitly after a full cross-browser compatibility run.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Compare the complete PR with its merge base
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check source and tests
        run: npm run build
  # Each engine gets an isolated runner. Firefox's full-page axe scans are
  # resource-heavy; sharing a VM with other browser engines caused intermittent
  # timeouts, hiding real regressions behind runner contention.
  # Skip browser setup when the inexpensive source/build job already fails.
  # Every browser engine remains mandatory after source validation succeeds.
  browser:
    name: Browser - ${{ matrix.engine }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: '--project=desktop-chromium --project=mobile-chromium'
          - engine: firefox
            projects: '--project=desktop-firefox'
          - engine: webkit
            projects: '--project=desktop-webkit --project=mobile-webkit'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.engine }} and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Cross-browser desktop/mobile journeys, accessibility and layout
        run: npm run test:browser -- ${{ matrix.projects }} --workers=1
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  release-gate:
    if: ${{ always() }}
    needs: [test, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain and enforce source and cross-browser gate
        env:
          SOURCE_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -eu
          echo "Source/build validation: $SOURCE_RESULT"
          echo "Chromium, Firefox, WebKit matrix: $BROWSER_RESULT"
          if [ "$SOURCE_RESULT" != "success" ] || [ "$BROWSER_RESULT" != "success" ]; then
            echo "::error::Refusing an unverified release: source and every browser project must pass."
            exit 1
          fi
          echo "All mandatory release checks passed."
