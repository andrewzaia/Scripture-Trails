name: Validate website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Compare the complete PR with its merge base
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate temporary minor release
        run: npm run release -- minor "Atlas passage preview" "Preview linked verses below the graph without changing its centre." "A second node click explicitly focuses the Atlas."
      - name: Check source and tests
        run: npm run build
