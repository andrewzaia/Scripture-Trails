name: Validate website

on:
  push:
    branches: [main, chore/enforce-all-release-versions-20261027]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'chore: trigger versioning policy v0.9.2 release'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run standard patch release
        run: npm run release -- patch "Consistent version history" "Strengthened release checks so every website update receives a new version and public changelog entry." "Improved consistency between the public release history and the website footer version."
      - name: Validate released website
        run: npm run build
      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json public/assets/app.js public/assets/graph.js public/assets/entity-index.js public/assets/connection-evidence.js
          git commit -m "Release v0.9.2: Consistent version history"
          git push origin HEAD:chore/enforce-all-release-versions-20261027
  test:
    if: "github.event_name == 'pull_request' || github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Compare the entire pull request to its merge base, not just the last commit
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check source and tests
        run: npm run build
