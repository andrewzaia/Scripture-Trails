name: Validate website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    if: "github.event_name == 'pull_request' && github.head_ref == 'chore/enforce-all-release-versions-20261027'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Determine whether the one-time patch release is needed
        id: release-check
        run: |
          if [ "$(node -p "require('./package.json').version")" = "0.9.1" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Execute the standard release command
        if: steps.release-check.outputs.needed == 'true'
        run: npm run release -- patch "Consistent version history" "Strengthened release checks so every website update receives a new version and public changelog entry." "Improved consistency between the public release history and the website footer version."
      - name: Validate released website
        if: steps.release-check.outputs.needed == 'true'
        run: npm run build
      - name: Commit generated release files
        if: steps.release-check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json public/assets/app.js public/assets/graph.js public/assets/entity-index.js public/assets/connection-evidence.js
          git commit -m "Release v0.9.2: Consistent version history"
          git push origin HEAD:chore/enforce-all-release-versions-20261027

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Check the full PR diff from its merge base
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check source and tests
        run: npm run build
