name: Prepare v0.44.16 Gospel stage wording release
on:
  push:
    branches:
      - release/v0.44.16-gospel-stage-context
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare the PATCH using the existing release process
        run: |
          npm run release -- patch "Clearer chronology and passage boundaries in Gospel journeys" \
            "Clarify that two Nazareth hometown-rejection study stages present Gospel narratives, not a historically proven second visit." \
            "Keep crucifixion summaries within their cited Scripture ranges, leaving subsequent burial arrangements in the existing burial study stage." \
            "Add targeted regression tests to protect passage accuracy, stable event references and the required research qualifications."
      - name: Validate release consistency and all source/data tests
        run: |
          npm run build
          npx playwright test --list
      - name: Remove temporary release job and commit verified release
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.44.16.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): prepare v0.44.16 Gospel stage wording"
          git push origin HEAD:release/v0.44.16-gospel-stage-context
