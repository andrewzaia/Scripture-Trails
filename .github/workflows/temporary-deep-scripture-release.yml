name: One-time Deep Scripture minor release
on:
  push:
    branches: [milestone/deep-scripture-20261027]
permissions:
  contents: write
jobs:
  release:
    if: "github.event.head_commit.message == 'chore: trigger deep Scripture v0.9.0 release'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Standard semantic minor release
        run: npm run release -- minor "Deep Scripture Connections" "Expanded passage-linked connection explanations to 115 and clarified editorial evidence status." "Added side-by-side Bible passage comparison with publisher-supplied text and attribution." "Introduced person-centred Scripture trails for eight major biblical figures."
      - name: Validate released site
        run: npm run build
      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json public/assets/app.js public/assets/entity-index.js public/assets/connection-evidence.js
          git commit -m "Release v0.9.0: Deep Scripture Connections"
          git push origin HEAD:milestone/deep-scripture-20261027
