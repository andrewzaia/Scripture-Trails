name: One-time Hebrew Bible index release preparation
on:
  push:
    branches: [milestone/old-testament-index-20261027]
permissions:
  contents: write
jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: prepare Hebrew Bible minor release'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Use the existing semantic release script
        run: npm run release -- minor "Explore Old Testament history and biblical kingdoms" "Added biblical people and event profiles from the ancestors of Israel to the Persian era." "Expanded the index with historical cities, ancient kingdoms, and sources distinguishing biblical narratives from archaeological records." "Added Hebrew Bible and Gospel filters and improved navigation between related Scripture entries."
      - name: Commit version and changelogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json
          git commit -m "Release v0.6.0: expand the biblical history index"
          git push origin HEAD:milestone/old-testament-index-20261027
