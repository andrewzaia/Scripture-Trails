name: Prepare v0.44.12 Gospel source alignment
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v04412-gospel-site-evidence-synchronisation' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate mandatory version and check
        run: |
          set -eu
          [ "$(node -p 'require("./package.json").version')" = "0.44.11" ] || exit 1
          npm run release -- patch "Consistent sources for disputed Gospel locations" "Add named et-Tell, el-Araj and Emmaus archaeological and textual research links to the Gospel audit, using references already verified in the historical-city studies." "Cross-check both source registries and require complete descriptive link labels; preserve unresolved identifications and independent review requirements." "Protect source provenance and rendered audit links through content and browser regression tests."
          npm run build
          npx playwright test --list
      - name: Commit generated release and remove preparation workflow
        run: |
          set -eu
          git rm .github/workflows/prepare-v04412.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare v0.44.12 site evidence consistency"
          git push origin HEAD:work/v04412-gospel-site-evidence-synchronisation
