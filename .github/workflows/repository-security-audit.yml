name: Reachable public Git-history security audit

on:
  push:
    branches: [audit/history-security-20261118]
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current public heads and tags for scoped history scanning
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Report only bounded scan counts and classifications
        run: node scripts/audit-public-history.mjs

  security-settings-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/audit/history-security-20261118'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
      vulnerability-alerts: read
    steps:
      - name: Inspect non-sensitive GitHub security feature status and alert counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          base = "https://api.github.com/repos/" + repo
          headers = {
            "Authorization": "Bearer " + token,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "scripture-trails-permission-audit"
          }
          def api(path):
            req = urllib.request.Request(base + path, headers=headers)
            try:
              with urllib.request.urlopen(req, timeout=25) as resp:
                body = resp.read(4000000)
                return resp.status, json.loads(body) if body else None
            except urllib.error.HTTPError as exc:
              return exc.code, None
          for kind, path in [
            ("repository-security-state", ""),
            ("dependency-graph", "/dependency-graph/sbom"),
            ("dependabot-alerts", "/dependabot/alerts?state=open&per_page=100"),
            ("code-scanning-alerts", "/code-scanning/alerts?state=open&per_page=100"),
            ("dependabot-eligibility", "/vulnerability-alerts"),
          ]:
            status, result = api(path)
            if kind == "repository-security-state":
              features = (result or {}).get("security_and_analysis")
              statuses = {name: (features.get(name) or {}).get("status", "not-in-response") for name in ("advanced_security","secret_scanning","secret_scanning_push_protection","dependabot_security_updates")} if features else {"state":"not-in-response"}
              print("Repository security settings: HTTP " + str(status) + " " + json.dumps(statuses))
            elif kind == "dependency-graph":
              print("Dependency SBOM endpoint: HTTP " + str(status) + (" (available)" if status == 200 else " (not verified)"))
            elif kind in ("dependabot-alerts", "code-scanning-alerts"):
              if status == 200 and isinstance(result,list):
                print(kind + ": HTTP 200, open alert count in first page=" + str(len(result)) + (" (additional pages possible)" if len(result)==100 else " (complete)"))
              else:
                print(kind + ": HTTP " + str(status) + " (configuration or alert count not verified)")
            else:
              print("Dependabot alerts enabled check: HTTP " + str(status) + (" (enabled)" if status == 204 else " (not verified)"))
          print("Secret scanning alert details require a separate scoped credential and were not requested.")
          PY
