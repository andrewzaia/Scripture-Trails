name: Reachable public Git-history security audit

on:
  push:
    branches: [audit/history-security-20261118]
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current public heads and tags for scoped history scanning
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Report only bounded scan counts and classifications
        run: node scripts/audit-public-history.mjs

  # Temporary audit branch only. Do not merge this one-off trigger.
  gitleaks-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/audit/history-security-20261118'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every advertised public branch, tag and PR head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pull/*'
          echo "Reachable commit count: $(git rev-list --count --all)"
          echo "Reachable object count: $(git rev-list --objects --all | wc -l)"
          echo "Ref count: $(git for-each-ref --format='%(refname)' refs/remotes refs/tags | wc -l)"
      - name: Scan reachable history with digest-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report="$RUNNER_TEMP/history-gitleaks.json"
          output="$RUNNER_TEMP/history-gitleaks.log"
          trap 'rm -f "$report" "$output"' EXIT
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/out" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact=100 --log-opts='--all' \
            --report-format json --report-path /out/history-gitleaks.json /repo \
            >"$output" 2>&1
          status=$?
          set -e
          if [[ "$status" != 0 && "$status" != 7 ]]; then
            echo "::error::Gitleaks could not finish (exit $status). No clean-history conclusion."
            exit 2
          fi
          if [[ "$status" == 7 && ! -s "$report" ]]; then
            echo "::error::Gitleaks reported findings without a readable private report."
            exit 2
          fi
          REPORT="$report" node --input-type=module -e '
            import fs from "node:fs";
            const path = process.env.REPORT;
            const rows = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path,"utf8")) : [];
            if (!Array.isArray(rows)) throw new Error("Unexpected scanner report format");
            const types = {};
            for (const finding of rows) {
              const type = String(finding.RuleID || "unclassified").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,80);
              types[type] = (types[type] || 0) + 1;
            }
            console.log("Gitleaks candidate count: " + rows.length);
            console.log("Gitleaks classifications only: " + JSON.stringify(types));
            // Intentionally omit matched strings, paths, line numbers and raw reports.
          '
          if [[ "$status" == 7 ]]; then
            echo "::warning::Potential secret findings need private review and rotation if confirmed."
            exit 1
          fi
          echo "Gitleaks reported no candidate secrets in reachable history."
