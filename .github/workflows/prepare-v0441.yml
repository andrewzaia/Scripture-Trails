name: Temporary prepare v0.44.1 privacy threat review
on:
  push:
    branches:
      - release/v0441-privacy-threat-audit-20261031
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0441-privacy-threat-audit-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Mandatory v0.44.1 PATCH release and full build
        run: |
          test "$(node -p "require('./package.json').version")" = "0.44.0"
          npm run release -- patch "Security and privacy: safer Scripture access" "Remove executable API.Bible usage-tracker scripts, replacing them with the documented privacy-conscious FUMS v3 GET while preserving required publisher usage reporting." "Harden Crossway search redirects, stalled requests, excessive responses and malformed results, and tighten site CSP and referrer protections." "Add scoped Cloudflare rate limiting for public Scripture APIs, security regression coverage and a transparent documented threat model with outstanding privacy and publisher-rights qualifications."
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare v0.44.1 with npm run release"
          git push origin HEAD:release/v0441-privacy-threat-audit-20261031
