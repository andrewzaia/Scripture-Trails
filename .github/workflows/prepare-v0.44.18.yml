name: Prepare v0.44.18 ESV reader accessibility release
on:
  push:
    branches:
      - release/v0.44.18-reader-accessibility
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate patch release with both public and repository changelogs
        run: |
          npm run release -- patch "Accessible Scripture reader publisher links" \
            "Remove invisible unnamed anchors returned in publisher Scripture markup, avoiding an unnecessary keyboard focus stop in the Bible reader." \
            "Preserve accessible names on intentionally labelled links and retain trusted publisher destinations, existing passages and attribution." \
            "Add cross-browser regression coverage using synthetic text, without copying copyrighted Scripture into tests."
      - name: Validate source build, release consistency and browser-suite registration
        run: |
          npm run build
          npx playwright test --list
      - name: Remove temporary workflow before opening release pull request
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.44.18.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): prepare v0.44.18 accessible reader markup"
          git push origin HEAD:release/v0.44.18-reader-accessibility
