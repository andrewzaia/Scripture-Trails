name: One-time versioning policy patch release
on:
  push:
    branches: [chore/enforce-all-release-versions-20261027]
permissions:
  contents: write
jobs:
  release:
    if: "github.event.head_commit.message == 'chore: trigger versioning policy v0.9.2 release'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Standard patch release
        run: npm run release -- patch "Consistent version history" "Strengthened release checks to ensure website changes always receive a new version and accompanying update notes." "Improved consistency between the public release history and the version shown on the website."
      - name: Validate released website
        run: npm run build
      - name: Commit standard release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json public/assets/app.js public/assets/graph.js public/assets/entity-index.js public/assets/connection-evidence.js
          git commit -m "Release v0.9.2: Consistent version history"
          git push origin HEAD:chore/enforce-all-release-versions-20261027
# One-time branch workflow removed after the standard release runs.
