name: Prepare v1.22.1
on:
  push:
    branches: [release/1.22.1-seo]
    paths: [.github/workflows/prepare-1.22.1.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run release -- patch "Hebrew and Aramaic search metadata" "Update search and social sharing descriptions to reflect Hebrew Old Testament and Aramaic Peshitta New Testament companion Scripture."
      - run: npm run build
      - run: |
          git config user.name "scripture-trails-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore(release): generate v1.22.1"
          git push origin HEAD:release/1.22.1-seo
