name: One-time academic accuracy release preparation

on:
  push:
    branches: [milestone/academic-accuracy-20261027]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'chore: prepare academic accuracy corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Use the existing release command
        run: npm run release -- patch "Clarify Atlas evidence and validate Scripture references" "Explained that Atlas votes indicate community-ranked relevance rather than scholarly confidence." "Improved checks for Scripture citation ranges and made outstanding research-source gaps clearer."
      - name: Commit generated version, footer and changelogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json
          git commit -m "Release v0.4.2: academic accuracy and reference integrity"
          git push origin HEAD:milestone/academic-accuracy-20261027
