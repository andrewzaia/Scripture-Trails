name: Prepare qualified v1 readiness release (one time)

on:
  push:
    branches: [release/qualified-device-acceptance-20261102]

permissions:
  contents: write

concurrency:
  group: prepare-qualified-v1-readiness
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run existing Semantic Versioning release command
        shell: bash
        run: |
          set -euo pipefail
          npm run release -- patch "Qualified v1 readiness compatibility acceptance" "Record the project's owner-accepted device and accessibility testing limitations, without claiming untested devices passed." "Distinguish tested, owner-accepted risk and open criteria in the public v1 roadmap and accompanying regression checks." "Complete scoped evidence and accessibility roadmap milestones while retaining mandatory CI and final launch approval."
          node -e "if(require('./package.json').version!=='0.44.24')process.exit(1)"
      - name: Build and run all repository source tests
        run: npm run build
      - name: Commit versioned release metadata and assets to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::Release script produced no changes"; exit 1; }
          git commit -m "chore(release): prepare v0.44.24 with npm run release"
          git push origin HEAD:release/qualified-device-acceptance-20261102
