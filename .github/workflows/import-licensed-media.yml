name: One-time licensed incident photo import

on:
  push:
    branches: [feature/christian-persecution-media-v1-6-0]

permissions:
  contents: write

jobs:
  fetch:
    if: contains(github.event.head_commit.message, 'import_verified_commons_media')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Fetch verified Commons thumbnails
        run: node scripts/import-persecution-media.mjs
      - name: Commit local image files to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/persecution-media/
          git diff --cached --quiet && exit 1
          git commit -m "assets: add licensed locally hosted incident photographs"
          git push origin HEAD:feature/christian-persecution-media-v1-6-0
