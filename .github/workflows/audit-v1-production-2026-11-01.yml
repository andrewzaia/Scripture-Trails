name: Diagnose production FUMS view reporting - one runner
on:
  push:
    branches:
      - audit/v1-live-production-2026-11-01
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect real NIV view and client FUMS reporting without leaking tokens
        run: node scripts/audit-fums-production.mjs
