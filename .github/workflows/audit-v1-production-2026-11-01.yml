name: Verify FUMS cache nonce acceptance - one low-cost runner
on:
  push:
    branches:
      - audit/v1-live-production-2026-11-01
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Check two real publisher GETs with stable anonymous IDs and fresh cache nonce
        run: node scripts/audit-fums-cache-nonce.mjs
