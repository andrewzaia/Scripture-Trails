name: Test licensed FUMS reporting via isolated pixel, one browser
on:
  push:
    branches:
      - audit/v1-live-production-2026-11-01
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Probe manual publisher pixel using real origin with test-only CSP
        run: node scripts/audit-fums-image.mjs
