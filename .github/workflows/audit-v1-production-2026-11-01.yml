name: v1 live production acceptance - single-runner audit
on:
  push:
    branches:
      - audit/v1-live-production-2026-11-01
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCRIPTURE_TRAILS_EXPECTED_VERSION: '0.44.18'
      SCRIPTURE_TRAILS_ORIGIN: https://www.scripturetrails.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install one real browser, not a full duplicate matrix
        run: npx playwright install --with-deps chromium
      - name: Check live release, publisher responses and actual browser interactions
        shell: bash
        run: |
          set +e
          npm run check:live-v1
          release_code=$?
          npm run check:live-reader
          reader_code=$?
          node scripts/audit-v1-production-live.mjs
          browser_code=$?
          set -e
          echo "Production release metadata: $release_code"
          echo "Four-edition publisher responses: $reader_code"
          echo "Real browser Atlas/notebook/navigation: $browser_code"
          test "$release_code" -eq 0
          test "$reader_code" -eq 0
          test "$browser_code" -eq 0
