name: Prepare v0.44.17 source accuracy and CI efficiency
on:
  push:
    branches:
      - release/v0.44.17-people-ci-efficiency
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate the versioned release and retained changelog history
        run: |
          npm run release -- patch "Accurate people readings and efficient release verification" \
            "Expand Moses' departure and Solomon's ark-entry readings to include the narrated actions, preserving all stable people trails." \
            "Keep Chromium, Firefox and WebKit mandatory for pull requests while eliminating redundant browser installations after strictly checked main merges." \
            "Add regression tests for canonical reading ranges and fail-closed release gates under permitted and rejected GitHub event states."
      - name: Validate complete source, version consistency and browser test registration
        run: |
          npm run build
          npx playwright test --list
      - name: Remove temporary preparation workflow and push complete checked patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.44.17.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): prepare v0.44.17 source accuracy and CI efficiency"
          git push origin HEAD:release/v0.44.17-people-ci-efficiency
