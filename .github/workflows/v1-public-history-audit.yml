name: One-time public history secret-pattern audit

on:
  push:
    branches: [audit/v1-public-history-20261102]
    paths:
      - .github/workflows/v1-public-history-audit.yml

permissions:
  contents: read

jobs:
  history-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all visible GitHub heads and tags without fetching secrets
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin
      - name: Scan reachable Git history, logging only metadata and counts
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,re,sys,collections
          def git(*args):
              return subprocess.check_output(['git',*args],stderr=subprocess.DEVNULL)
          raw=git('rev-list','--objects','--all').decode('utf-8','replace').splitlines()
          entries=[line.split(' ',1) for line in raw]
          paths=collections.defaultdict(set)
          for parts in entries:
              if len(parts)>1:paths[parts[0]].add(parts[1])
          sensitive_names=re.compile(r'(?:^|/)(?:\.env(?:\.[^/]*)?|\.dev\.vars|[^/]*(?:credential|secret|private.?key|agreement|api.?bible.?contract)[^/]*|[^/]*\.(?:pem|p12|pfx|key|pdf|sqlite|db|bak))$',re.I)
          known_safe=re.compile(r'\.env\.example$|^sources/openbible/cross-references\.zip$',re.I)
          suspect_names=sorted(set(p for values in paths.values() for p in values if sensitive_names.search(p) and not known_safe.search(p)))
          # Identifiable token formats only. Not an exhaustive scanner for
          # unprefixed keys. Never write potentially secret values to logs.
          signatures={
            'private-key-header':re.compile(rb'-----BEGIN (?:RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----'),
            'github-token':re.compile(rb'\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b|github_pat_[A-Za-z0-9_]{20,}'),
            'aws-access-id':re.compile(rb'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'),
            'google-api-key':re.compile(rb'\bAIza[A-Za-z0-9_-]{30,}\b'),
            'stripe-live-key':re.compile(rb'\bsk_live_[A-Za-z0-9]{16,}\b'),
            'slack-token':re.compile(rb'\bxox[baprs]-[A-Za-z0-9-]{24,}\b')
          }
          seen=set();scanned=0;skipped=0;hits=collections.defaultdict(list)
          for sha_path in entries:
              sha=sha_path[0]
              if sha in seen:continue
              seen.add(sha)
              header=git('cat-file','-s',sha)
              # Skip huge objects and non-text media; never log their data.
              size=int(header.strip())
              if size>1_000_000:skipped+=1;continue
              if git('cat-file','-t',sha).strip()!=b'blob':continue
              b=git('cat-file','blob',sha)
              if b'\x00' in b[:4096]:skipped+=1;continue
              scanned+=1
              for name,pattern in signatures.items():
                  if pattern.search(b):hits[name].append(sha[:12])
          print('REACHABLE_OBJECTS',len(seen))
          print('TEXT_BLOBS_SCANNED',scanned)
          print('OVERSIZE_OR_BINARY_SKIPPED',skipped)
          print('SUSPICIOUS_FILENAMES_COUNT',len(suspect_names))
          # Print filenames only after replacing potentially sensitive detail.
          for p in suspect_names[:20]:print('SUSPICIOUS_FILENAME_EXT',p.split('.')[-1].lower() if '.' in p else 'none')
          print('TOKEN_PATTERN_HIT_COUNTS',dict((k,len(v)) for k,v in hits.items()))
          # GitHub refs and all reachable objects are scoped; dangling blobs,
          # removed remote refs, binary archives and generic keys are not covered.
          if suspect_names or hits:sys.exit(1)
          PY
