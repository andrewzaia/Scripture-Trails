name: Prepare v0.44.10 launch evidence patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v04410-v1-acceptance-emmaus' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run mandatory release and source tests
        run: |
          set -eu
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "0.44.9" ]; then
            echo "Expected main v0.44.9; refusing duplicate release from $VERSION"
            exit 1
          fi
          npm run release -- patch "Emmaus evidence and v1 launch acceptance tooling" "Clarify the competing Luke 24 Emmaus distances, historical Josephus readings and location uncertainty with traceable academic and Bible commentary references." "Add a read-only versioned production HTML, roadmap, changelog and asset verification command and focused offline regression tests without copying publisher Bible text." "Publish an honest eight-blocker v1 launch evidence ledger and Cloudflare rollback procedure, retaining all mandatory acceptance gates and source/browser CI checks."
          npm run build
          npx playwright test --list
      - name: Remove one-time workflow and commit versioned release
        run: |
          set -eu
          git rm .github/workflows/prepare-v04410.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare v0.44.10 v1 acceptance patch"
          git push origin HEAD:work/v04410-v1-acceptance-emmaus
