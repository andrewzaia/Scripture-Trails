name: Prepare stable v1 major release (one time)

on:
  push:
    branches: [release/v1-0-0-owner-approved-20261102]
    paths:
      - .github/workflows/v1-major-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check documented owner approval and readiness tests
        run: node --test tests/v1-readiness.test.mjs
      - name: Use existing SemVer release command to prepare v1.0.0
        run: |
          npm run release -- major "Scripture Trails 1.0 - first stable release" \
            "Launch the first stable Scripture Trails release with the four authorised Bible translations, Bible Atlas, Scripture-linked studies, people, places, journeys and personal notebook." \
            "Complete the documented v1.0 owner launch decision and readiness review, retaining explicitly identified physical-device and Safari zoom testing limitations." \
            "Maintain evidence-backed content, publisher attribution, privacy safeguards, recovery procedures and the protected cross-browser release gates."
      - name: Verify full build, release data and all Node tests
        run: npm run build
      - name: Commit only the prepared major release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/data/releases.json public/index.html public/assets CHANGELOG.md
          git commit -m "release: prepare Scripture Trails v1.0.0 stable launch"
          git push origin HEAD
