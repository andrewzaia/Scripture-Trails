name: Prepare v0.44.15 source bibliography release
on:
  push:
    branches:
      - release/v0.44.15-geography-bibliography
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out all release history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare the semantic PATCH and both changelogs
        run: |
          npm run release -- patch "More accurate Gospel geography source references" \
            "Correct Nain's archaeological report date to its official 2022 journal citation and add precise bibliographic details." \
            "Use the original excavation director's institutional Sidon study to improve provenance and replace an intermittently inaccessible project link." \
            "Preserve existing Scripture references and location uncertainty while adding regression tests for the cited research."
      - name: Validate full release and discover browser suites
        run: |
          npm run build
          npx playwright test --list
      - name: Remove one-time workflow and commit validated release
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.44.15.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): prepare v0.44.15 geography bibliography"
          git push origin HEAD:release/v0.44.15-geography-bibliography
