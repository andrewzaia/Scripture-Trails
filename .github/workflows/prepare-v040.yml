name: Temporary prepare v0.40.0 complete Pauline Scripture study
on:
  push:
    branches:
      - release/v0.40-complete-paul-depth-20261031
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.40-complete-paul-depth-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate and validate v0.40.0 using mandatory release command
        run: |
          test "$(node -p "require('./package.json').version")" = "0.39.0"
          npm run release -- minor "All Pauline journeys: complete Scripture study depth" "Add original Acts-based context and connected reading passages to the remaining 44 third-journey and Rome-voyage stages, completing all 83 Pauline studies." "Explain Spirit-related Jerusalem warnings and preserve distinctions between reached harbours, offshore passages, planned ports and unknown wreck sites." "Add scoped academic and commentary sources while leaving independent specialist review and the remaining v1.0 acceptance criteria open."
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare v0.40.0 with npm run release"
          git push origin HEAD:release/v0.40-complete-paul-depth-20261031
