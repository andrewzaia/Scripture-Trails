name: Prepare v0.44.13 study reference release
on:
  push:
    branches:
      - release/v0.44.13-contextual-readings
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare the patch using the existing release script
        run: |
          npm run release -- patch "Contextual readings for journals and people trails" \
            "Add five missing biblical context readings to guided journals, retaining previous progress entries and approximate study times." \
            "Extend Abraham, David and Paul person trails to include their narrated events, and clarify the Abrahamic covenant sign." \
            "Add source-qualified regression tests for canonical ranges, saved progress, and editorial review labels; keep full v1 scholarly review open."
      - name: Validate full release and discover browser suites
        run: |
          npm run build
          npx playwright test --list
      - name: Remove temporary release workflow and commit the checked patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.44.13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): prepare v0.44.13 journal and person corrections"
          git push origin HEAD:release/v0.44.13-contextual-readings
