name: Migrate pinned CrossWire Peshitta
on:
  push:
    branches:
      - feature/hebrew-peshitta-parallel-scripture
    paths:
      - scripts/import-crosswire-peshitta.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hebrew-peshitta-parallel-scripture
          persist-credentials: true
      - name: Download pinned CrossWire archive
        run: |
          curl --fail --location --retry 4 --retry-delay 3 --output /tmp/Peshitta.zip https://ftp.crosswire.org/ftpmirror/pub/sword/packages/rawzip/Peshitta.zip
          echo "badce0aa0a9b70a9c81891ed48d5a9e86de1e24d12ad4ad378e060e03cabc7b9  /tmp/Peshitta.zip" | sha256sum -c -
      - name: Generate source shards
        run: python3 scripts/import-crosswire-peshitta.py /tmp/Peshitta.zip
      - name: Update attribution and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/data/originals/NOTICE.txt')
          s=p.read_text()
          start=s.index('New Testament:')
          end=s.index('The traditional Peshitta',start)
          s=s[:start]+'''New Testament: CrossWire Peshitta SWORD module version 2.0 (2020-02-08),
          British and Foreign Bible Society 1905 Syriac edition.
          DistributionLicense=Public Domain, per bundled module metadata.
          https://ftp.crosswire.org/sword/modules/ModInfo.jsp?modName=Peshitta
          Raw archive SHA-256: badce0aa0a9b70a9c81891ed48d5a9e86de1e24d12ad4ad378e060e03cabc7b9

          '''+s[end:]
          s=s.replace('Data generated by scripts/import-original-languages.py.', 'Data generated by scripts/import-original-languages.py and scripts/import-crosswire-peshitta.py.')
          p.write_text(s)
          Path('public/data/originals/LICENSE-SYRNT.txt').unlink(missing_ok=True)
          p=Path('tests/original-languages.test.mjs')
          s=p.read_text().replace("assert.equal(manifest.sourceCommits.syrnt,'dae3eb6ff62b9b272fb503646796c25d248175ce');","assert.equal(manifest.sourceArchives.crosswirePeshitta.sha256,'badce0aa0a9b70a9c81891ed48d5a9e86de1e24d12ad4ad378e060e03cabc7b9');")
          s=s.replace("assert.ok(['he','syc'].includes(data.language));","assert.ok(['he','syc'].includes(data.language));\n  if(data.language==='syc')assert.match(data.source,/CrossWire Peshitta.*1905/);")
          p.write_text(s)
          PY
      - name: Verify corpus and build
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/originals sources/original-languages/manifest.json tests/original-languages.test.mjs
          git commit -m "fix: replace SEDRA corpus with pinned public-domain CrossWire Peshitta"
          git push origin HEAD:feature/hebrew-peshitta-parallel-scripture
