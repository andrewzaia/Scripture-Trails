name: Prepare v0.44.7 Jericho evidence patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v0447-jericho-calibration-qualifications' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate mandatory SemVer PATCH and validate
        run: |
          set -eu
          CURRENT_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$CURRENT_VERSION" != "0.44.6" ]; then
            echo "Unexpected release baseline: $CURRENT_VERSION; do not publish twice."
            exit 1
          fi
          npm run release -- patch "Clearer archaeological chronology for Jericho" "Qualify the 1995 Tell es-Sultan radiocarbon calibration as provisional, distinguish cereal and charcoal results, and avoid attributing the dated destruction to the events or actors narrated in Joshua 6." "Link to the original Radiocarbon publisher record and DOI, retaining source rights and the distinction between Bronze Age and Gospel-era Jericho." "Add regression coverage protecting the archaeological dating caveats."
          npm run build
      - name: Remove preparation workflow and commit release
        run: |
          set -eu
          git rm .github/workflows/prepare-v0447.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare v0.44.7 Jericho evidence patch"
          git push origin HEAD:work/v0447-jericho-calibration-qualifications
