name: Temporary prepare v0.41.0 Gospel Scripture context
on:
  push:
    branches:
      - release/v0.41-gospel-context-20261031
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.41-gospel-context-20261031
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate and validate v0.41.0 using mandatory release script
        run: |
          test "$(node -p "require('./package.json').version")" = "0.40.0"
          npm run release -- minor "Gospel journeys: substantive Scripture study for every event" "Add 79 original Gospel episode study contexts and 156 connected canonical reading references across the entire journey." "Document the disputed census and Herod-era dating, Mark's transmitted ending and Luke-Acts ascension variants using bounded publisher and academic sources." "Preserve the Gospel geography and chronology warnings while leaving independent specialist review and remaining v1.0 acceptance criteria open."
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare v0.41.0 with npm run release"
          git push origin HEAD:release/v0.41-gospel-context-20261031
