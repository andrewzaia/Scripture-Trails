name: One-time v0.33.0 release preparation

on:
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'v1-release-readiness-20261030' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run the existing release command exactly once
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "0.32.0" ]; then
            echo "Already released: $VERSION"
            exit 0
          fi
          npm run release -- minor \
            "Version 1.0 readiness roadmap and release gates" \
            "Introduce a dedicated Road to v1.0 section with five public acceptance gates and 17 measurable requirements covering evidence, content, accessibility, privacy and launch verification." \
            "Publish a transparent baseline of four scoped automated criteria met and 13 outstanding criteria, with actionable next steps and a proposed release sequence." \
            "Prevent a v1.0 launch while required conditions remain open, and validate editorial citation gaps, evidence records and release-readiness consistency in website builds." \
            "Improve cache versioning for the public roadmap stylesheet, and add automated and browser regression coverage for readiness reporting."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/data/releases.json CHANGELOG.md public/index.html public/assets scripts/release.mjs
          git commit -m "Prepare v0.33.0 release using npm run release -- minor"
          git push origin HEAD:refs/heads/v1-release-readiness-20261030
