name: Prepare Hebrew and Peshitta release
on:
  push:
    branches:
      - feature/hebrew-peshitta-parallel-scripture
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Import pinned original-language texts
        run: python3 scripts/import-original-languages.py
      - name: Generate v1.22.0 using the official release command
        run: |
          npm run release -- minor \
            "Hebrew and Syriac Scripture alongside English" \
            "Read the Hebrew Old Testament and the Syriac Aramaic New Testament alongside the selected English edition." \
            "Explore original-language passages in the Bible reader, Atlas passage preview, passage comparison and Scripture hover previews." \
            "Provide locally hosted source editions, source attribution and Hebrew-to-English verse-number alignment."
      - name: Validate build, release history and test suite
        run: npm run build
      - name: Install Chromium for targeted browser checks
        run: npx playwright install --with-deps chromium
      - name: Test Scripture reader, previews and Atlas in Chromium
        run: npx playwright test tests/browser/scripture-previews.spec.mjs tests/browser/atlas-fullscreen.spec.mjs tests/browser/reader-sanitisation.spec.mjs --project=desktop-chromium
      - name: Remove one-time release workflow and commit release
        run: |
          git rm .github/workflows/prepare-original-language-release.yml
          git add package.json package-lock.json public CHANGELOG.md scripts/release.mjs sources/original-languages tests/original-languages.test.mjs
          git config user.name "scripture-trails-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v1.22.0: Hebrew and Syriac alongside English Scripture"
          git push origin HEAD:feature/hebrew-peshitta-parallel-scripture
