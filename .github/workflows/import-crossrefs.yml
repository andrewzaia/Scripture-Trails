name: Rebuild local Atlas references

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripture-atlas-reference-refresh
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Rebuild from the reviewed local source archive
        run: npm run import:refs
      - name: Validate local data and website
        run: npm run build
      - name: Reject unversioned regenerated Atlas data
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- public/data/refs)" ]; then
            echo "::error::Atlas data changed. A versioned pull request with matching changelogs, footer and full release checks is required."
            git status --short -- public/data/refs
            exit 1
          fi
          echo "Reviewed Atlas data is deterministic and unchanged."
