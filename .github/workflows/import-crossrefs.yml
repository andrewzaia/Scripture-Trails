name: Refresh atlas cross-references

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-crossrefs.yml'
      - 'scripts/import-crossrefs.mjs'
      - 'scripts/check-crossrefs.mjs'

permissions:
  contents: write

concurrency:
  group: scripture-atlas-reference-refresh
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned openly licensed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            'https://raw.githubusercontent.com/trekhleb/bible-cross-references/2abb53a56a38be023201463b95afaf7d6420ebbd/data/raw/openbible-cross-references.zip' \
            -o "$RUNNER_TEMP/atlas-references.zip"
          printf '%s  %s\n' '83e9db0a08054ed99848531512729f0190dbbac85416f408f2362b5dc36d421d' "$RUNNER_TEMP/atlas-references.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/atlas-source"
          unzip -q "$RUNNER_TEMP/atlas-references.zip" -d "$RUNNER_TEMP/atlas-source"
          echo 'Archive contents:'
          find "$RUNNER_TEMP/atlas-source" -type f -maxdepth 3 -print
      - name: Build and validate reference shards
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(find "$RUNNER_TEMP/atlas-source" -type f \( -name 'cross_references.txt' -o -name 'cross-references.txt' \) -print -quit)
          if [ -z "$SOURCE" ]; then echo 'Cross-reference TSV not found'; exit 1; fi
          node scripts/import-crossrefs.mjs "$SOURCE"
          npm test
          node scripts/check-crossrefs.mjs
      - name: Commit versioned atlas data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/data/refs/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import attributed OpenBible.info atlas references'
            git push origin HEAD:main
          else
            echo 'Atlas reference data unchanged.'
          fi
