name: Rebuild local Atlas references

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripture-atlas-reference-refresh
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Rebuild from the reviewed local source archive
        run: npm run import:refs
      - name: Validate local data and website
        run: npm run build
      - name: Commit deterministic Atlas data if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/refs/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild Atlas from reviewed local OpenBible snapshot'
            git push origin HEAD:main
          else
            echo 'Local Atlas data is unchanged.'
          fi
