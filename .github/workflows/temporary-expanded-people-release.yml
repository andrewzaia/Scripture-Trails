name: One-time people index release preparation
on:
  push:
    branches: [fix/people-index-expansion-20261027]
permissions:
  contents: write
jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: prepare expanded people index minor release'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Standard semantic release
        run: npm run release -- minor "Find more biblical people and kingdoms" "Expanded the People Index with over 100 further cited biblical figures, including major names from both Testaments." "Featured Hezekiah, David, Solomon, Moses, Paul and Assyria as directly selectable entries." "Improved search guidance, retry options and loading consistency across new releases."
      - name: Commit public changelog, developer changelog and versioned assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json public/assets/app.js public/assets/entity-index.js
          git commit -m "Release v0.7.0: expand biblical people and improve discovery"
          git push origin HEAD:fix/people-index-expansion-20261027
