name: One-time Atlas hover patch release
on:
  push:
    branches: [fix/atlas-hover-shortest-path-20261027]
permissions:
  contents: write
jobs:
  release:
    if: "github.event.head_commit.message == 'chore: trigger Atlas hover v0.9.1 release'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Standard semantic patch release
        run: npm run release -- patch "Trace the shortest Atlas connections" "Hover over an Atlas verse to illuminate the shortest displayed route back to the centre in green." "See every verse and connection along the route, with a clearer route legend and unchanged navigation controls."
      - name: Validate released site
        run: npm run build
      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/index.html public/data/releases.json public/assets/app.js public/assets/graph.js public/assets/entity-index.js public/assets/connection-evidence.js
          git commit -m "Release v0.9.1: Trace the shortest Atlas connections"
          git push origin HEAD:fix/atlas-hover-shortest-path-20261027
